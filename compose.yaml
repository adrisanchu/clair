services:
  db:
    image: postgres:16-alpine
    container_name: clair_db
    restart: always
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    volumes:
      - clair_pgdata:/var/lib/postgresql/data
volumes:
  clair_pgdata:
